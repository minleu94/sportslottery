name: Continuous Integration

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend (TypeScript & Vite)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run Core Test Suite (Security, Betting Integrity, Backup/Restore, Resilience)
        run: |
          python -m pytest tests/test_phase1_security.py tests/test_phase2_betting_integrity.py tests/test_sqlite_backup_restore.py tests/test_external_source_resilience.py tests/test_wallet_atomicity.py tests/test_ticket_settlement.py tests/test_bet_validation.py tests/test_profile_manager.py -v
