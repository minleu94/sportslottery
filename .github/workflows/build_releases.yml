name: Build & Release Cross-Platform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows 11 Installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pyinstaller pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend SPA Bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run E2E Integration & Security Regression Tests
        run: |
          python -m pytest tests/test_modern_api.py tests/test_profile_manager.py tests/test_wallet_atomicity.py tests/test_ticket_settlement.py -v

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Standalone Executable & Installers
        shell: powershell
        run: |
          .\packaging\windows\build_windows.ps1

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*

      - name: Release to GitHub (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/Sportslottery_Win11_Setup_*.exe
            dist/installer/Sportslottery_Win11_Portable_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS DMG Installer
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pyinstaller

      - name: Build Standalone macOS DMG
        run: |
          chmod +x ./packaging/mac/build_mac.sh
          ./packaging/mac/build_mac.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/installer/*.dmg

      - name: Release to GitHub (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/Sportslottery_macOS_*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
