services:
  sportslottery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportslottery-server
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - PORT=8100
      - PYTHONUNBUFFERED=1
    volumes:
      # 持久化資料庫、快取與設定檔
      - ./data:/app/data
      - ./config:/app/config

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "sportslottery:8100"
      - "--url=fifty-saddlebag-immortal.ngrok-free.dev"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - sportslottery
